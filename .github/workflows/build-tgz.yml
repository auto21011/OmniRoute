name: Build & Pack TGZ

on:
  push:
    branches:
      - feat/error-rules-ui-3851
      - feat/error-rules-ui-3851-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Pack TGZ
    runs-on: ubuntu-latest
    steps:
      # The hosted image ships ~30 GB of toolchains this build never uses; without
      # freeing them node_modules (~4.3 GB) plus .next and dist leave the runner short
      # on disk and the job dies mid-build with no log.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      # No swapfile: with a 12 GB V8 heap on a 16 GB runner the kernel swapped hard
      # during page-data collection, the build crawled for 50+ minutes and the runner
      # was killed with no log. The heap is capped below RAM instead (see the build
      # step), so nothing should ever need to swap.
      - name: Show runner resources
        run: |
          free -h
          df -h /
          nproc

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app & CLI bundle
        run: npm run build:release
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          OMNIROUTE_BUILD_MEMORY_MB: "6144"
          OMNIROUTE_USE_TURBOPACK: "1"

      - name: Pack TGZ
        run: npm pack

      - name: Show TGZ info
        run: ls -lh omniroute-*.tgz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-tgz
          path: omniroute-*.tgz
          retention-days: 7

      - name: Create release with TGZ
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          gh release create "build-${SHORT_SHA}" omniroute-*.tgz \
            --title "Build ${SHORT_SHA}" \
            --notes "Automated build from commit ${SHORT_SHA} on branch ${{ github.ref_name }}" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
