name: Build & Pack TGZ

on:
  push:
    branches:
      - feat/error-rules-ui-3851
      - feat/error-rules-ui-3851-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Pack TGZ
    runs-on: ubuntu-latest
    steps:
      - name: Expand Virtual Memory (10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app & CLI bundle
        run: npm run build:release
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          OMNIROUTE_BUILD_MEMORY_MB: "12288"
          OMNIROUTE_USE_TURBOPACK: "1"

      - name: Pack TGZ
        run: npm pack

      - name: Show TGZ info
        run: ls -lh omniroute-*.tgz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-tgz
          path: omniroute-*.tgz
          retention-days: 7

      - name: Create release with TGZ
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          gh release create "build-${SHORT_SHA}" omniroute-*.tgz \
            --title "Build ${SHORT_SHA}" \
            --notes "Automated build from commit ${SHORT_SHA} on branch ${{ github.ref_name }}" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
